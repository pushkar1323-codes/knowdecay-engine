# ── KnowDecay Engine — Docker Compose ─────────────────────────────────────────
#
# Workflows:
#   docker compose up                                 — development (hot-reload)
#   docker compose up db                              — database only
#   docker compose --profile tools run --rm migrate   — run database migrations
#   docker compose --profile production up            — production mode
#   docker compose --profile test up db-test          — isolated test database
#
# Cleanup:
#   docker compose down                               — stop containers
#   docker compose down -v                            — stop + delete volumes
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: knowdecay_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowdecay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowdecay}
      POSTGRES_DB: ${POSTGRES_DB:-knowdecay}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - knowdecay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowdecay} -d ${POSTGRES_DB:-knowdecay}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - knowdecay

  # ── KnowDecay API (Development) ────────────────────────────────────────────
  # Hot-reload enabled, source mounted, auto-migration on startup
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowdecay_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowdecay}:${POSTGRES_PASSWORD:-knowdecay}@db:5432/${POSTGRES_DB:-knowdecay}
      APP_ENV: development
      AUTO_MIGRATE: "true"
    volumes:
      - .:/app
      - /app/__pycache__
    entrypoint: ["/bin/bash", "scripts/entrypoint.sh"]
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - knowdecay

  # ── KnowDecay API (Production) ─────────────────────────────────────────────
  # Gunicorn + Uvicorn ASGI workers, no source mount, no auto-migration
  api-production:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowdecay_api_prod
    restart: unless-stopped
    profiles:
      - production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowdecay}:${POSTGRES_PASSWORD:-knowdecay}@db:5432/${POSTGRES_DB:-knowdecay}
      APP_ENV: production
      AUTO_MIGRATE: "false"
    entrypoint: ["/bin/bash", "scripts/entrypoint.sh"]
    command:
      - gunicorn
      - app.main:app
      - -c
      - gunicorn.conf.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - knowdecay

  # ── Database Migration Runner ──────────────────────────────────────────────
  # Dedicated migration service — safe for multi-replica deployments.
  # Usage: docker compose --profile tools run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowdecay_migrate
    profiles:
      - tools
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowdecay}:${POSTGRES_PASSWORD:-knowdecay}@db:5432/${POSTGRES_DB:-knowdecay}
    entrypoint: ["/bin/bash", "scripts/entrypoint.sh"]
    command:
      - alembic
      - upgrade
      - head
    networks:
      - knowdecay

  # ── Test Database ──────────────────────────────────────────────────────────
  # Ephemeral PostgreSQL for running integration tests locally.
  # Data stored in tmpfs — wiped on container stop (fast, no disk I/O).
  # Usage: docker compose --profile test up db-test
  db-test:
    image: postgres:16-alpine
    container_name: knowdecay_db_test
    profiles:
      - test
    environment:
      POSTGRES_USER: knowdecay_test
      POSTGRES_PASSWORD: knowdecay_test
      POSTGRES_DB: knowdecay_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowdecay_test -d knowdecay_test"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - knowdecay

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  knowdecay:
    name: knowdecay_network

# ── Persistent Volumes ────────────────────────────────────────────────────────
volumes:
  knowdecay_pgdata:
    name: knowdecay_pgdata
